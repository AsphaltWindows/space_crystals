scheduler_interval: 20

message_types:
  - name: feature_request
    description: A feature/change description with QA instructions. Produced by designer (originals) or QA agents (reworks on failure). Consumed by task_splitter. Also forwarded by task_splitter to completion_aggregator.
    template: templates/messages/feature_request.md

  - name: developer_task
    description: A single unit of implementation work. Produced by task_splitter, consumed by task_planner.
    template: templates/messages/developer_task.md

  - name: feature_tasks
    description: Manifest mapping a feature_request to its developer_task filenames. Produced by task_splitter, consumed by completion_aggregator.
    template: templates/messages/feature_tasks.md

  - name: planned_task
    description: A developer_task enriched with codebase context and dependencies. Produced by task_planner, consumed by developer.
    template: templates/messages/planned_task.md

  - name: task_completion
    description: Marker indicating a developer_task was completed. Produced by developer, consumed by completion_aggregator.
    template: templates/messages/task_completion.md

  - name: architecture_request
    description: A documented architectural refactoring proposal with references to architecture docs. Produced by software_architect, consumed by task_splitter. Prioritized over feature_requests.
    template: templates/messages/architecture_request.md

  - name: qa_item
    description: A completed feature ready for QA. Contains original feature_request content and QA instructions. Produced by completion_aggregator, routed by qa_router to manual_qa or automatic_qa.
    template: templates/messages/qa_item.md

nodes:
  - name: designer
    type: source
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent designer
    scheduled: true
    close_vote_required: true
    description: |
      Interactive game design agent. Collaboratively develops RTS game design with the user
      through interactive sessions. Maintains design documents in its artifact space and produces
      feature_request messages (including QA instructions) for downstream processing by the Task Splitter.
      The Designer is also launched by the scheduler in non-interactive mode to handle forum
      topics that require its close-vote.
    consumes: []
    produces:
      - type: feature_request
        to: [task_splitter]
        description: One message per design change or coherent group of related changes, including QA instructions. Multiple messages per session.
    interactive_mode: |
      The user starts a design session. The Designer:
      1. Loads insights from artifacts/designer/insights.md
      2. Checks forum/open/ for topics needing attention — handles forum work first
      3. Reviews pending design reviews and loose ends from insights
      4. Enters collaborative design session with the user
      5. Updates design documents in artifacts/designer/design/
      6. Produces a feature_request message (with QA instructions) to messages/task_splitter/feature_request/pending/ for each change
      7. Updates insights, appends to session log, exits
    non_interactive_mode: |
      Launched by the scheduler when open forum topics need the designer's close-vote.
      The Designer:
      1. Loads insights from artifacts/designer/insights.md
      2. Reads open forum topics in forum/open/
      3. Comments on or votes to close topics as appropriate
      4. If a topic requires user input to answer a design question, notes it in insights
         for the next interactive session — does NOT answer design questions autonomously
      5. Appends to session log, exits

  - name: software_architect
    type: source
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent software_architect
    scheduled: true
    close_vote_required: true
    description: |
      Senior game-dev software architect with RTS and Bevy expertise. Monitors forum
      discussions for architectural concerns, investigates code and design, tracks
      recurring issues, maintains architecture documents, and produces architecture_request
      messages for the task_splitter to decompose into refactoring tasks.
    consumes: []
    produces:
      - type: architecture_request
        to: [task_splitter]
        description: A documented architectural refactoring proposal referencing architecture docs in artifacts/software_architect/architecture/. At most one per execution.
    interactive_mode: |
      User can ask the software_architect to:
      - Analyze specific parts of the codebase architecture
      - Review recurring issues and propose refactors
      - Discuss testing strategy and coverage gaps
      - Examine Bevy/ECS patterns in use
      - Review and update architecture documents
    non_interactive_mode: |
      Launched by the scheduler when open forum topics exist.
      1. Loads insights from artifacts/software_architect/insights.md
      2. Reads open forum topics — investigates code and design for topics in its domain
      3. Adds comments with architectural analysis or votes to close
      4. If forum discussions reveal actionable architectural concerns, documents them
         in artifacts/software_architect/architecture/ and optionally produces an
         architecture_request to task_splitter
      5. Reviews tracked recurring issues from insights for new proposals
      6. Appends to session log, exits

  - name: task_splitter
    type: processing
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent task_splitter
    scheduled: true
    close_vote_required: true
    description: |
      Decomposes feature_request and architecture_request messages into developer_tasks.
      Reads design documents, architecture documents, and examines the codebase to ensure
      tasks are sensible, avoid duplicate work, and minimize unnecessary special cases.
      Forwards the original request and a feature_tasks manifest to the completion_aggregator.
      Prioritizes architecture_requests over feature_requests.
    consumes:
      - type: architecture_request
        priority: 1
      - type: feature_request
        priority: 2
    produces:
      - type: developer_task
        to: [task_planner]
        description: A single unit of implementation work, scoped and described. Multiple per request.
      - type: feature_request
        to: [completion_aggregator]
        description: The original feature_request forwarded unchanged (only for feature_request inputs).
      - type: feature_tasks
        to: [completion_aggregator]
        description: Manifest mapping a feature_request to its developer_task filenames.
    interactive_mode: |
      User can ask the task_splitter to explain its decomposition rationale, re-split
      a feature_request differently, or adjust task granularity.
    non_interactive_mode: |
      Picks up one feature_request from messages/task_splitter/feature_request/pending/.
      1. Loads insights from artifacts/task_splitter/insights.md
      2. Reads the feature_request
      3. Reads relevant design docs from artifacts/designer/design/
      4. Examines the codebase for technical context and existing patterns
      5. Decomposes into developer_tasks, writes each to messages/task_planner/developer_task/pending/
      6. Forwards the original feature_request to messages/completion_aggregator/feature_request/pending/
      7. Writes a feature_tasks manifest to messages/completion_aggregator/feature_tasks/pending/
      8. Moves the processed feature_request to done
      9. Updates insights, appends to session log, exits

  - name: task_planner
    type: processing
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent task_planner
    scheduled: true
    close_vote_required: true
    description: |
      Enriches developer_tasks with codebase context, producing developer-ready planned_tasks.
      Investigates the codebase to identify relevant files, existing patterns, integration points,
      and dependencies. Also surfaces refactor suggestions via the forum when codebase investigation
      reveals structural issues.
    consumes:
      - type: developer_task
        priority: 1
    produces:
      - type: planned_task
        to: [developer]
        description: A developer_task enriched with technical context and dependency info. 1:1 with input.
    interactive_mode: |
      User can ask the task_planner to explain its technical analysis, re-plan a task
      with different context, or discuss codebase architecture.
    non_interactive_mode: |
      Picks up one developer_task from messages/task_planner/developer_task/pending/.
      1. Loads insights from artifacts/task_planner/insights.md
      2. Reads the developer_task
      3. Investigates the codebase — finds relevant files, patterns, dependencies
      4. Reads relevant design docs from artifacts/designer/design/ for broader context
      5. Produces a planned_task to messages/developer/planned_task/pending/
      6. Moves the processed developer_task to done
      7. If codebase investigation reveals refactor-worthy patterns, opens a forum topic
      8. Updates insights, appends to session log, exits

  - name: developer
    type: processing
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent developer
    scheduled: true
    close_vote_required: true
    description: |
      Implements planned_tasks by writing code and tests. The project source code lives
      in artifacts/developer/ — the developer is the sole writer of all project code.
      Produces task_completion markers to the completion_aggregator when done.
    consumes:
      - type: planned_task
        priority: 1
    produces:
      - type: task_completion
        to: [completion_aggregator]
        description: Marker indicating a planned_task was implemented. 1:1 with input.
    interactive_mode: |
      User can ask the developer to explain implementation decisions, review code,
      debug issues, or re-implement a task differently.
    non_interactive_mode: |
      Picks up one planned_task from messages/developer/planned_task/pending/.
      1. Loads insights from artifacts/developer/insights.md
      2. Reads the planned_task (task description, technical context, dependencies)
      3. Checks that dependencies are satisfied
      4. Implements the code in artifacts/developer/
      5. Writes tests
      6. Verifies the build compiles
      7. Produces a task_completion to messages/completion_aggregator/task_completion/pending/
      8. Moves the planned_task to done
      9. Updates insights, appends to session log, exits

  - name: completion_aggregator
    type: processing
    command: scripts/completion_aggregator.sh "$NODE_ROOT" "$NODE_NAME"
    scheduled: true
    close_vote_required: false
    description: |
      Script node that tracks developer task completions against feature_tasks manifests.
      When all developer_tasks for a feature_request are complete, produces a qa_item
      for the QA router containing the original feature_request content and QA instructions.
    consumes:
      - type: feature_tasks
        priority: 1
      - type: feature_request
        priority: 2
      - type: task_completion
        priority: 3
    produces:
      - type: qa_item
        to: [qa_router]
        description: A completed feature ready for QA. Contains the original feature_request content and QA instructions.

  - name: qa_router
    type: processing
    command: scripts/qa_router.sh "$NODE_ROOT" "$NODE_NAME"
    scheduled: true
    close_vote_required: false
    description: |
      Script node that routes qa_items to either manual_qa or automatic_qa based on
      whether the QA steps can be performed automatically with current tooling.
      Checks QA instructions against artifacts/qa_router/auto_capabilities.txt.
    consumes:
      - type: qa_item
        priority: 1
    produces:
      - type: qa_item
        to: [manual_qa, automatic_qa]
        description: The same qa_item forwarded to either manual_qa or automatic_qa.

  - name: manual_qa
    type: sink
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent manual_qa
    scheduled: false
    close_vote_required: false
    description: |
      Interactive QA agent. Walks the user through QA steps from qa_items.
      On pass, the feature is complete. On failure, produces a feature_request
      back to task_splitter with refined requirements and QA instructions
      based on what passed and what failed.
    consumes:
      - type: qa_item
        priority: 1
    produces:
      - type: feature_request
        to: [task_splitter]
        description: Rework request for a failed QA item. Contains refined requirements and QA instructions scoped to what failed. Filename uses _r{N} suffix.
    interactive_mode: |
      The user starts a QA session. The Manual QA agent:
      1. Loads insights from artifacts/manual_qa/insights.md
      2. Checks forum/open/ for topics needing attention
      3. Picks up one qa_item from messages/manual_qa/qa_item/pending/
      4. Presents the QA instructions to the user step by step
      5. Records pass/fail for each step based on user feedback
      6. On full pass: moves qa_item to done, logs completion
      7. On failure: produces a feature_request to messages/task_splitter/feature_request/pending/
         with refined content and QA instructions scoped to the failure
      8. Updates insights, appends to session log, exits
    non_interactive_mode: |
      The manual_qa agent is not scheduled. It is only launched interactively by the user.

  - name: automatic_qa
    type: processing
    command: claude -p "Run in non-interactive mode" --allowedTools "Read,Write,Edit,Glob,Grep,Bash" --agent automatic_qa
    scheduled: true
    close_vote_required: true
    description: |
      Autonomous QA agent. Executes automated QA steps from qa_items — running tests,
      checking compilation, verifying automated criteria. On pass, the feature is complete.
      On failure, produces a feature_request back to task_splitter with refined requirements
      and QA instructions based on what passed and what failed.
    consumes:
      - type: qa_item
        priority: 1
    produces:
      - type: feature_request
        to: [task_splitter]
        description: Rework request for a failed QA item. Contains refined requirements and QA instructions scoped to what failed. Filename uses _r{N} suffix.
      - type: qa_item
        to: [qa_router]
        description: Bounced qa_item that automatic_qa determined it cannot verify. Returned to qa_router with a note explaining why automation was not possible, so it can be re-routed to manual_qa.
    interactive_mode: |
      User can ask the automatic_qa agent to explain test results, re-run QA for
      a specific item, or review its QA methodology.
    non_interactive_mode: |
      Picks up one qa_item from messages/automatic_qa/qa_item/pending/.
      1. Loads insights from artifacts/automatic_qa/insights.md
      2. Reads the qa_item QA instructions
      3. Evaluates whether the QA steps are actually automatable with current tooling
      4. If NOT automatable: sends the qa_item back to qa_router with a note explaining
         why, optionally opens a forum topic requesting automation infrastructure, moves
         the qa_item to done, exits
      5. Executes each automatable QA step (cargo test, cargo check, etc.)
      6. On full pass: moves qa_item to done, logs completion
      7. On failure: produces a feature_request to messages/task_splitter/feature_request/pending/
         with refined content and QA instructions scoped to the failure
      8. Updates insights, appends to session log, exits
