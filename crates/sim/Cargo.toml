[package]
name = "sc_sim"
description = "Space Crystals deterministic game simulation (no engine dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# The integration tests are modules of the test programs below (slice M5-T): `tests/sim.rs` says how to add one.
autotests = false

[dependencies]
serde.workspace = true
libm.workspace = true
glam.workspace = true

[lints]
workspace = true

[dev-dependencies]
# JSON round-trip tests of scenario files, saves and replays (approved for tests only).
serde_json = "1"

[[test]]
name = "sim"
path = "tests/sim.rs"

# The `*_perf` timings, apart, so that a release build for them compiles nothing else.
[[test]]
name = "perf"
path = "tests/perf.rs"

# (M5-X1b) The games on other rules than the built-in ones, apart: the rules a game reads are the process's.
[[test]]
name = "rules"
path = "tests/rules.rs"
